name: Fold root diagnostic

# Manual, diagnostic-only, temporary. The fold-root fix needs to be verified on the runner, but
# `pnpm test` now dies in batch 1 on another lane's incomplete `respond_level_up` action, so batch 11
# (where the fold tests live) never runs. This runs only those two files. Delete once verified.
on:
  workflow_dispatch:

jobs:
  fold-root:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --cwd vendor/magic-context --frozen-lockfile
      - run: bun run --cwd vendor/magic-context/packages/pi-plugin build
      - run: pnpm --dir vendor/pi-koe install --frozen-lockfile
      - run: pnpm run build
        working-directory: vendor/pi-koe/packages/voice-protocol
      - run: pnpm install --frozen-lockfile
      - run: node host/scripts/build-windows-stale-lock-reclaimer.mjs
      - run: node host/scripts/build-windows-reparse-inspector.mjs
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: pnpm --dir host build:test
      - name: The two fold files, as CI would run them
        working-directory: host
        run: node --import ./scripts/compiled-test-bootstrap.mjs --test --test-concurrency=1 --test-reporter=spec dist-test/pi-magic-context-fold-channel.test.js dist-test/pi-magic-context-chapter-fold.test.js
        env:
          GAMEBUDDY_BUN_EXECUTABLE: ${{ steps.bun.outputs.bun-path }}
