name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A push can land without GitHub creating a run: on 2026-11-05 `git push` reported
  # `[remote rejected] … fatal error in commit_refs_rules`, the retry succeeded, and no run was ever
  # created for the new HEAD — so `main` carried no CI reading at all. Manual dispatch is the way to get
  # one without inventing an empty commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: windows-latest
    # Bounded so a hang is one loud, named failure instead of an unbounded job
    # that both blocks every later step's signal and holds a runner. Measured
    # 2026-10-16: `test:mounted` hung for 106 minutes with an empty log (its
    # first real execution - earlier gates had always been red), while the
    # identical command finishes locally in 1.8m.
    #
    # Sized on the WORK, not on that hazard. Measured 2026-10-17: the job spends
    # ~20 minutes on the 43 steps before `pnpm test` (including the 3.4-minute
    # mounted zone, the native builds and the C# restore), and the host suite
    # itself runs 45-60 minutes locally - so a 60-minute job bound would cut a
    # healthy run at the last step. The hazard it guards is still bounded at the
    # step that has it (`test:mounted`, 25 minutes), which is the tighter and
    # more meaningful limit.
    timeout-minutes: 120
    steps:
      # vendor/magic-context and vendor/pi-koe are git submodules (d8bf059,
      # 00e7640) and the steps below install and build inside both. A fresh
      # checkout without `submodules: recursive` leaves them empty.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: 1.4.2
      # Build the vendored source before pnpm packages the local dependency.
      # Host production build hashes the packaged artifact against this output.
      - run: bun install --cwd vendor/magic-context --frozen-lockfile
      # NOT `pnpm build:magic-context`. pnpm 11 verifies and completes dependencies before it runs a script, so that
      # spelling installed the whole workspace FIRST (measured 2026-11-07, run 42463460197: 08:35:39 `Scope: all 5
      # workspace projects` .. 08:35:55 `Done in 16.9s`, then `$ bun run ... build` at 08:35:56), importing both
      # `file:` dependencies from trees whose gitignored `dist/` did not exist yet. Setting
      # `npm_config_verify_deps_before_run: "false"` on the step did not stop it - the install still ran - so the
      # ordering is fixed structurally: this script calls `bun` directly and no pnpm process decides anything first.
      - run: node tools/build-magic-context.mjs
      # pi-koe is the Voice repository mounted as vendor/pi-koe (git submodule)
      # and is a pnpm workspace of its own, so the root install does not install
      # it. Its protocol package must exist BEFORE the root install: the root
      # `pnpm install` snapshots the `file:` dependency into the pnpm store AT
      # RESOLUTION TIME, and `dist/` is gitignored in the submodule, so a fresh
      # checkout snapshots a store copy with no dist. The same ordering is what
      # release-windows.yml already needed for the identical reason.
      - run: pnpm --dir vendor/pi-koe install --frozen-lockfile
      - run: pnpm run build
        working-directory: vendor/pi-koe/packages/voice-protocol
      # The gate runs AFTER the install, because the installed copy is what the compiler reads and it does not exist
      # before the install. Before the fix, pnpm installed the workspace ahead of the vendor build, so that copy was
      # captured from a tree with no `dist/` - measured in run 42463460197, where a gate reading the SOURCE tree said
      # `0 violations` at 08:36:11 and `host build:test` failed one second later with 32 TS2307. Both trees are read
      # now, and the install above is the one after the build.
      - run: pnpm install --frozen-lockfile
      - run: node tools/check-vendor-build-artifacts.mjs
      - run: pnpm check:host-windows-test-preflight
      - run: pnpm test:host-windows-test-preflight
      # Knip reachability runs ahead of format:check and lint, so the formatter that held the
      # job for eight weeks never masked it: it ran green in every run that reached format:check
      # and went red only at 76cb49da (2026-10-14), when `lint` stopped being `biome lint ...`
      # and became a ratchet that spawns the biome binary by path. The one dependency knip could
      # no longer see that way is named, with its reason, in knip.json rather than ignored wholesale.
      - name: Check Knip reachability
        run: pnpm check:knip
      # Orphan-script and complexity-ratchet gates (Phase 4 of the workspace
      # governance task): any package.json script entry pointing at a missing
      # file, any core-file line-count ceiling breach, and any leftover
      # untracked debris fail CI. (knip itself already covers unreferenced
      # files; these three add the reverse directions.)
      - run: pnpm check:script-entries
      # A runbook that hands a maintainer `--setup <path>` must name an artifact a build script
      # publishes. Measured 2026-10-31: the sandbox runbook's commands pointed at
      # `desktop/dist/setup/GameBuddy.Setup.exe`, which nothing produced - the directory held one
      # manual publish and a fresh checkout could not reproduce it.
      - run: pnpm check:build-artifact-producers
      # The complexity gate is a ratchet on the line count a core file had at its recorded baseline,
      # not on the absolute ceilings it has already breached (see the gate's own header): it fails
      # the change that grows a core file and passes the four that are already over their target.
      - run: pnpm check:complexity-gate
      - run: pnpm test:complexity-gate
      - run: pnpm check:workspace-debris
      # The formatter step is a ratchet, not a repo-wide reformat demand: it fails only on a file
      # that newly joins the recorded red set (682 files at 2516ffa4) and prints that total on every
      # run, so the debt stays visible while a violation in the change under test still fails.
      - run: pnpm format:check
      - run: pnpm test:format-ratchet
      # The lint step is a ratchet too: it fails only on a file that newly joins the recorded red set
      # (70 files / 88 errors at 1ea90abe) or whose error count grows, and prints the live
      # error/warning totals on every run, so the debt stays visible while a new violation still
      # fails. It was added in b9650bd9 behind a formatter step that was repo-wide red until
      # e90da3b2, so its first real execution (run 38582152926) is where the 87 errors were seen.
      - run: pnpm lint
      # The second half of the frontend lint pair. It ran nowhere until the CI coverage gate named
      # it: only `quality:check`, which no job runs, held it.
      - run: pnpm lint:ast-grep
      - run: pnpm check:host-module-graph
      - run: pnpm check:dialogue-web-boundaries
      - run: pnpm test:dialogue-web-boundaries
      - run: pnpm check:host-production-import-boundary
      - run: pnpm check:error-identity-classification
      - run: pnpm test:error-identity-classification
      # A gate is not wired until its own suite runs too: the rule and the tests that keep the
      # rule honest are a pair, and a rule whose suite runs nowhere is how a green check hides
      # a broken gate.
      - run: pnpm check:host-diagnostic-output
      - run: pnpm test:host-diagnostic-output
      - run: pnpm check:test-store-teardown
      - run: pnpm test:test-store-teardown
      # The pre-commit hook blocks a commit whose own Host sources do not compile
      # (`tools/scripts/pre-commit.mjs` runs this), and the rule is only linked if CI
      # runs the scoping predicate too: the hook's judgement is one function, and a
      # predicate that returned an empty set would turn every commit green.
      # `--rev HEAD~1` is the per-push half: CI has no staged index, so this asks the
      # same question of the commit just made. Invoked by path rather than through a
      # `check:` script because `package.json` is being edited by another lane here.
      - run: node host/scripts/check-staged-test-typecheck.mjs --rev HEAD~1
      - run: node --test host/scripts/check-staged-test-typecheck.test.mjs
      # Both read Host sources through the workspace's own TypeScript compiler
      # (host/scripts/production-artifact.mjs), so they need this job's install and belong here
      # rather than in the install-free `gates` job. Neither ran anywhere before the CI coverage gate.
      - run: pnpm check:host-game-physical-seam
      - run: pnpm check:live-run-failure-dump
      - run: pnpm typecheck
      # `pnpm typecheck` reads the working tree, so it cannot see a commit that only compiles
      # because another lane's uncommitted work is present. This checks the commit itself.
      - run: pnpm check:head-typecheck
      - run: node tools/check-publint.mjs
      - run: pnpm report:clones
      # This builds only the browser's contributor-quality bundle; ordinary CI
      # has no authority to assemble a Host production generation.
      - run: pnpm --filter @gamebuddy/dialogue-web build
      # The two native helper pairs must exist before the frontend's static zone runs: the parity table in
      # `dialogue-web/tests/parity-model-selection.test.mjs` constructs the real Chat runtime, and that runtime
      # builds a `createBuildWindowsStaleLockReclaimer`, which refuses with
      # `windows_stale_lock_reclaimer_unavailable` when `native/**/.dist` is absent. These are the same two
      # builders, in the same order, that this job already ran before `pnpm test`.
      - run: node host/scripts/build-windows-stale-lock-reclaimer.mjs
      - run: node host/scripts/build-windows-reparse-inspector.mjs
      # The three frontend gate zones, named explicitly. dialogue-web's own `test`
      # is only its static zone and root `pnpm test` runs the vendored and
      # companion-host suites, so an aggregate command leaves the artifact and
      # mounted zones running nowhere - a gate that stops running is worse than a
      # gate that fails. The step that used to run the frontend suites was dropped
      # because the old aggregate needed a freshly assembled Host production
      # generation; no zone does (static reads source, the artifact zone builds its
      # own private staging copy, the mounted zone drives the vite dev server).
      - run: pnpm --filter @gamebuddy/dialogue-web test:static
      - run: pnpm --filter @gamebuddy/dialogue-web test:artifact
      - name: Install the frontend journeys' Chromium
        run: pnpm --dir dialogue-web exec playwright install --with-deps chromium
      - run: pnpm --filter @gamebuddy/dialogue-web test:mounted
        timeout-minutes: 25
      # The host suite's compiled-test bootstrap mints fixed Windows helper pairs
      # and REFUSES to run without them: `compiled-test-bootstrap.mjs` imports
      # `createBuildWindowsStaleLockReclaimer()`, which throws
      # `windows_stale_lock_reclaimer_unavailable` when `native/**/.dist` is
      # absent - measured as `pnpm test`'s first failure once the mounted hang was
      # fixed and this step finally executed (the job had never reached it before).
      # The same two builders already ran above, before the frontend zones (the parity table builds the
      # real runtime too); these are idempotent rebuilds kept here so `pnpm test` does not depend on that
      # ordering, and the SDK comes from global.json, exactly as release-windows.yml's setup-dotnet does.
      - run: node host/scripts/build-windows-stale-lock-reclaimer.mjs
      - run: node host/scripts/build-windows-reparse-inspector.mjs
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # `pnpm test`'s receipt-parity case runs `dotnet test` over GameBuddy.Stardew.Core.Tests, which targets
      # net6.0. global.json selects the 8.0 SDK for the build, and the hosted runner no longer carries a 6.0
      # runtime - so without this the test host refuses to start with only 8.x present. The stardew-scaffold job
      # already installs it for the same reason; this job reached the step for the first time once the earlier
      # failures were fixed.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      # The host suite's receipt-parity case shells out to `dotnet test --no-restore` over
      # GameBuddy.Stardew.Core.Tests, so those projects must be restored first - the same
      # restore the stardew-scaffold job runs before its C# suites. Without it the case fails
      # on an absent project.assets.json, which the suite reports as
      # stardew_receipt_parity_dotnet_failed (measured: FAIL before this step, PASS after).
      - run: dotnet restore GameBuddy.sln --locked-mode
      # The host suite resolves its `bun` test-dependency invocation from this variable and
      # deliberately refuses the npm bun.ps1 shim on PATH (fixed argv cannot execute it), so a bare
      # `bun` on PATH is not enough. Measured as `test_dependency_bun_executable_unset` when this
      # step finally executed - it never had before, because the knip gate died ahead of it.
      # Bounded generously, on the measured work (45-60 minutes locally): the whole host suite runs
      # here, and a step timeout is what keeps a future stall inside this step nameable.
      - run: pnpm test
        timeout-minutes: 90
        env:
          GAMEBUDDY_BUN_EXECUTABLE: ${{ steps.bun.outputs.bun-path }}
      # THE GATES THAT COMPARE THE BRIDGE'S DECLARATIONS AGAINST EACH OTHER, wired where a commit cannot skip them.
      #
      # `snapshot-loopback` exists precisely for "the Mod publishes what the Host rejects", and it WAS red on
      # 2026-11-01 (`rockSourceTargets` carried an id with `:` and `,` that `opaqueId` can never match) while a live
      # run died at 64s with `invalid_snapshot:rockSourceTargets`. Nobody ran it, because neither script was invoked by
      # any job or hook. A gate nobody runs is a comment.
      #
      # The step below names its files ONE BY ONE rather than globbing, because the corpus it runs is a decision: the
      # three declaration pairs (the Mod's records against the Host's predicates, their numeric domains, and the
      # language-neutral schema against both) plus the catalog and reachability gates. `host/src/schema-contract.test.ts`
      # was reachable only through `pnpm test`'s 90-minute compiled corpus, so its verdict had no name a developer could
      # run alone; it has one here.
      #
      # All of them run through `bun test` (the same shape `test:stardew-completion-evidence` uses): they import
      # `./protocol.js` and `./wire-declaration.test-support.js`, which are the ESM specifiers the COMPILED tree
      # resolves, and Bun maps them onto the `.ts` sources. `node --test --experimental-strip-types` does not, which is
      # why the scripts were green-in-name-only for as long as they were.
      - run: pnpm test:stardew-wire-agreement
      - run: pnpm test:stardew-snapshot-loopback
      # The composed runtime's launch contract: the environment block the launcher hands the Host child
      # (including the embedded-runtime declaration the background historian is gated on) and the session
      # entry it publishes. This one file has no `test:` script of its own, so the aggregate corpus step
      # below does not reach it - the contract could be deleted
      # without anything noticing, which is exactly how a composed session silently lost its fold.
      - name: Composed runtime contract gate
        run: node --test tools/desktop-composition-launch.test.mjs
      # The rest of the `tools/` suite corpus: 67 `test:` scripts over 72 files that no job ran. The runner
      # derives that set from package.json each run (so a new suite is wired by existing), runs it as one
      # concurrent `node --test`, skips the suites whose prerequisite (the `design/` mount, the gitignored
      # decompile) a checkout does not create, and names the suites that are still red - with owner and
      # reason - in tools/tool-test-corpus-quarantine.json. It fails if one of those starts passing, so an
      # exclusion cannot outlive its defect.
      - run: pnpm test:tool-corpus
      - run: pnpm dependency-audit
      - run: pnpm check:dependency-risk
      - run: pnpm test:dependency-risk
      - run: git diff --exit-code -- third_party/sbom-node.json
      # The Windows launcher's own suite runs HERE, not in a job of its own, because it needs
      # this job's workspace: its fixture publishes a Host production generation through the
      # canonical publisher (the Host closure, the dialogue-web browser build, artifact
      # verification). Measured 2026-10-19: the fixture's default path shares that publish as one
      # Lazy task, so a publisher failure is inherited by every fixture-backed case at once - the
      # 2026-09-20 run of this suite reports 26 failures that are all the same
      # `stardew-mod-package-contract.js` publisher error, and a lane part-way through an
      # unrelated Host edit fails the same way. So the generation is built once here, as its own
      # named step, and handed to the suite through the door the fixture documents
      # (`GAMEBUDDY_DESKTOP_TEST_GENERATION_ROOT`), which the fixture validates before use.
      #
      # The order is the fixture's own: the tests project publishes the self-contained exact-child
      # runtime fixture that the generation build takes as its runtime tree.
      - run: dotnet build desktop/GameBuddy.Desktop.Tests -c Debug
      - run: node host/scripts/build-desktop-launcher-test-generation.mjs "${{ runner.temp }}/desktop-launcher-generation" desktop/GameBuddy.Desktop.Tests/bin/Debug/net8.0-windows/Fixtures/ExactChildBootstrapFixture
      # Bounded on the measured work: the whole suite runs 15.7 minutes on a warm developer machine
      # (`测试总数: 306`), and every fixture-backed case spawns real launcher/guardian/Host children at
      # 15-70 seconds each, so a hosted runner's slower disk is the variable this number covers.
      - run: dotnet test desktop/GameBuddy.Desktop.Tests -c Debug --no-build
        timeout-minutes: 45
        env:
          GAMEBUDDY_DESKTOP_TEST_GENERATION_ROOT: ${{ runner.temp }}/desktop-launcher-generation

  # Which gates run, and which do not, is DERIVED from package.json on every run by
  # `tools/check-ci-coverage.mjs` - not written out here. Every `check:*` / `audit:*` / `lint*` /
  # `typecheck*` / `report:*` script that no other job names lands in this job's `--run` set, so a
  # new gate is live in CI by being named like one. The job installs the workspace and builds the
  # test artifact because two gates in that derived set are not source-only: `check:harness-conformance`
  # probes native-local runners through `host/dist-test`, and `check:perf-budget` benches against it.
  # Without them the derived set fails on a fresh checkout for a reason that has nothing to do with
  # the change under test - the failure read `runner_missing_cli` and `artifact_missing` on 2026-10-25.
  # A gate that needs the game, the decompiled tree, the `design/` mount or a live generation is named
  # with its reason (and its measurement) in that file, and its verdict fails if such an entry goes
  # stale. Splitting the gates off the `host` job keeps them out of its 43-step serial chain, where a
  # red step early hides everything behind it.
  gates:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Installing needs the submodules: `pnpm install` walks the workspace, and `vendor/magic-context` and
      # `vendor/pi-koe` are submodules. Without this the install failed with ENOENT on `vendor/…` before a
      # single gate could run.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The same prerequisite chain the `host` job runs, in the same order - and the order is the point.
      # `build:test` compiles the test project, which imports `@gamebuddy/voice-protocol`; that package is a
      # `file:` dependency into `vendor/pi-koe`, a submodule with its own lockfile and a gitignored `dist/`.
      # The root `pnpm install` snapshots the `file:` dependency into the pnpm store *at resolution time*, so
      # the protocol package has to be BUILT before that install runs, or the snapshot has no `dist/` and the
      # compile fails with `Cannot find module '@gamebuddy/voice-protocol'`.
      - run: bun install --cwd vendor/magic-context --frozen-lockfile
      # See the `host` job: `pnpm build:magic-context` installs the workspace before the build it depends on.
      - run: node tools/build-magic-context.mjs
      - run: pnpm --dir vendor/pi-koe install --frozen-lockfile
      - run: pnpm run build
        working-directory: vendor/pi-koe/packages/voice-protocol
      - run: pnpm install --frozen-lockfile
      # See the `host` job: the gate reads the installed copy, which the install above creates.
      - run: node tools/check-vendor-build-artifacts.mjs
      # The two gates that need it. `pnpm build:test` under host is the locked entry (`build-test-artifact`),
      # which is what `assertLiveRunArtifactFresh` in the harness loader requires.
      - run: pnpm --dir host build:test
        timeout-minutes: 15
      # `check-release-generation-self-contained` asks whether the generation on disk holds every module it names AND
      # every module the current `production-artifact.config.json` declares - measured 2026-11-07 it did not hold
      # `composition/companion-session-reflection.js`, whose import lives in a source file emitted a day after the
      # artifact was frozen, so no specifier inside the artifact could point at it. With no generation on disk (a clean
      # checkout: `host/dist` is gitignored) it reports `not_measured` and exits 0, which is the honest reading here.
      #
      # `check-production-artifact` is deliberately NOT here. It re-verifies the publisher's own complete artifact, and
      # that artifact cannot be built outside the release pipeline: `build-production-artifact` refuses without a
      # verified bundled runtime (`verified_bundled_runtime_input_required`), so on a runner with no such input the step
      # could only ever be red. It runs in `release-windows.yml`, immediately after the generation is assembled.
      - run: node tools/check-release-generation-self-contained.mjs
      - run: node --test tools/check-release-generation-self-contained.test.mjs
      # A shipped bundle must not name the machine that built it. Measured: `bun build` inlined
      # `E:\\projects\\ai-game-companion\\vendor\\...` into `__dirname`/`__filename` for the CommonJS dependencies
      # it bundles, and the release lane only noticed at packaging time - six files, on a path that means
      # nothing on a player's machine. This job runs the same build, so it can say so on the push instead.
      - run: node tools/check-vendored-bundle-leaks.mjs
      - run: node --test tools/check-vendored-bundle-leaks.test.mjs
      # A workflow expression may only use the contexts GitHub allows in that position. Measured: `if: ${{ secrets.X }}`
      # makes GitHub reject the whole file with "Unrecognized named-value: 'secrets'", and
      # `KEY: ${{ env.KEY }}` re-exporting a value an earlier step wrote to GITHUB_ENV is always empty. Neither is
      # visible in review and both are fatal at runtime, so the workflow file itself is now checked.
      - run: node tools/check-workflow-expressions.mjs
      - run: node --test tools/check-workflow-expressions.test.mjs
      - run: node tools/check-ci-coverage.mjs
      # `check:draft-declaration-coverage` drives a mounted zone, and the prerequisite it declares is a Chromium the
      # checkout does not create. Without this the gate refuses with `playwright_browser_missing`, which reads in the
      # summary exactly like a real finding - the shape this repo keeps paying for.
      - run: pnpm --dir dialogue-web exec playwright install --with-deps chromium
        timeout-minutes: 10
      - run: node tools/check-ci-coverage.mjs --run
      # The totality audit's full finding list, kept per run so "is this getting better?" has an answer that is not a
      # memory. `--verbose` prints every site (the default report prints counts with a bounded sample), and the step runs
      # after the gate so a red gate still leaves its evidence behind.
      - if: always()
        run: node tools/audit-totality.mjs --verbose > audit-totality.txt
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-totality
          path: audit-totality.txt
          retention-days: 30
          if-no-files-found: ignore

  voice-gateway:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      # pi-koe is the split-out Voice repository (git submodule). It is a
      # pnpm workspace of its own: the gateway consumes an independently
      # compiled and tested protocol there, not through the main workspace.
      - run: pnpm install --frozen-lockfile
        working-directory: vendor/pi-koe
      - run: pnpm run build:protocol
        working-directory: vendor/pi-koe
      - run: pnpm run build
        working-directory: vendor/pi-koe
      - run: pnpm run test
        working-directory: vendor/pi-koe
      - run: pnpm run typecheck
        working-directory: vendor/pi-koe

  stardew-scaffold:
    runs-on: windows-latest
    env:
      # The two suites below are gated on a licensed game folder.
      # Nothing in this workflow ever WROTE this variable, so the guard read like a deliberate condition while
      # making both steps un-runnable since 2026-09-29 - the shape `check:ci-dead-conditions` exists for. A
      # repository variable is the writer: leave it unset on a hosted runner (the steps skip, as today), set it
      # on a self-hosted, game-attached lane and they run.
      GAMEBUDDY_STARDEW_GAME_PATH: ${{ vars.GAMEBUDDY_STARDEW_GAME_PATH }}
    steps:
      # The root `pnpm install --frozen-lockfile` below resolves host's
      # `file:../vendor/pi-koe/packages/voice-protocol` dependency, so this job
      # needs the submodule checked out too.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The Stardew projects and their tests target net6.0, and the hosted runner no longer carries a 6.0
      # runtime, so the test host refuses to start: "Framework: 'Microsoft.NETCore.App', version '6.0.0'"
      # with only 8.x/9.x/10.x present. global.json still selects the 8.0 SDK for the build itself.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - run: pnpm install --frozen-lockfile
      - run: dotnet restore GameBuddy.sln --locked-mode
      # THE ONLY STEP THAT COMPILES THE MOD'S OWN SOURCE, and the reason this job needs a C#
      # compiler at all rather than two `dotnet test` calls. Measured 2026-10-31: `def2fb07`
      # committed one side of a rename, HEAD carried 20 CS errors in `farmhandexecutioncontroller.*.cs`,
      # and every job in this file reported success - because the two steps below build
      # `GameBuddy.Stardew.Core.Tests` and the no-game subset, and neither references
      # `GameBuddy.Stardew.csproj`. The commit also added an assertion that the deleted member was
      # gone, inside a project the defect made uncompilable, so the gate could not run either.
      #
      # The gate derives its population from `git ls-files '*.csproj'` and asks the compiler about
      # each one. It needs no licensed game folder: `Pathoschild.Stardew.ModBuildConfig` 4.4.0 emits
      # its own `<Error>` before the compiler runs when `GamePath` holds no game, and this repository
      # tracks no game assembly, so the six game-dependent projects register that refusal by name
      # (with what the exclusion costs) and the other twenty-three must compile. A CS diagnostic is
      # a failure even for a registered project: the register excuses a missing prerequisite, never
      # broken source. Run BEFORE the two suites so a broken commit is one named compile failure
      # rather than a cascade of build errors from tests that inherit it.
      - name: Compile every tracked C# project
        id: csharp_compile
        # 29 sequential builds: 55s warm, ~50s on a machine with the game. The bound is on the
        # hazard, not the work - a build that wedges should fail HERE by name rather than hold a
        # runner, which is the same reasoning the `host` job's step timeouts carry. This job has no
        # `timeout-minutes`, so the step is the tighter limit.
        timeout-minutes: 20
        run: pnpm check:csharp-compile
      # THE SUITE STEPS BELOW CARRY `!cancelled()`, and that is not decoration. Every step in this
      # job can fail ahead of them - the install, the restore, the compile gate just above - and a
      # skipped step is indistinguishable from a passing one in the job's own verdict: the run says
      # "stardew-scaffold: failure" either way. Measured on `def2fb07`, in this very job's shape:
      # the commit's own regression test asserted the deleted member was gone, the project holding
      # it would not compile, and every job reported success while not one assertion ran. A suite
      # that did not run is not a pass, so the suite steps run regardless of what failed before them
      # and the job summary says which one did not run.
      - run: dotnet test integrations/stardew/tests/GameBuddy.Stardew.Core.Tests --no-restore
        id: stardew_core_tests
        if: ${{ !cancelled() }}
      # The part of the Stardew suite that needs no game at all. GameBuddy.Stardew.Integration.Tests
      # references the Mod project, so its build package demands a licensed game folder and a hosted
      # runner can never build it - which is why the two steps below are gated. That gate is honest
      # about the project and dishonest about a SUBSET: the files that need neither the game nor the
      # Mod assembly only compile against GameBuddy.Stardew.Core, and those tests ran nowhere on a
      # hosted runner before the project below existed. Neither count is written here; the runner
      # prints both, because a count in a comment rots the first time a suite file is added.
      #
      # The project includes those files from their one location in the suite - it holds no copy - and
      # its runner asserts that before it builds, so a forked snapshot cannot go green while the
      # originals drift. It also prints how much of the suite it did NOT run, and the step is named to
      # be unreadable as "the integration suite passed": the two gated steps below are the only
      # evidence about the files it does not compile, and they run only where a licensed game folder
      # is configured.
      #
      # The project's file list is DERIVED, never maintained: the gate below builds the suite's files
      # against GameBuddy.Stardew.Core alone, drops every file the compiler refuses, and repeats until
      # a build succeeds. That fixpoint is the compiler's own answer to "which files are game-free",
      # so the gate cannot agree with a hand-edited list - the list has to agree with it. It fails by
      # name in both directions: a headless file left out of the lane (its tests would run nowhere)
      # and a game-dependent file put in it (the lane would go red for a reason unrelated to the
      # change that broke it).
      - name: Stardew no-game subset matches the compiler
        id: stardew_nogame_subset_audit
        if: ${{ !cancelled() }}
        run: node tools/audit-stardew-nogame-subset.mjs
      - name: Stardew no-game test subset (not the integration suite)
        id: stardew_nogame_tests
        if: ${{ !cancelled() }}
        run: node integrations/stardew/tests/GameBuddy.Stardew.NoGame.Tests/run-nogame-tests.mjs
      # The action-development package's own gate chain: scaffold contract, the three action-artefact
      # checks (surface, export, source projection) and the static production admission. Every one of
      # them reads files or drives dotnet; none needs a licensed game folder, which is why this step is
      # NOT gated the way the two suites below are.
      #
      # It ran nowhere before this step existed. `action:ci` had no caller in any workflow, and the
      # package's own `test` script sat behind the GAMEBUDDY_STARDEW_GAME_PATH gate below - so the
      # artefact checks went unexecuted from 2026-09-29 to 2026-11-02 while the surface they validate
      # changed shape. The source projection drifted, the parity checker still expected nine descriptor
      # members when 80 of 95 published actions carried a tenth, and a stale checked-in artefact was
      # committed on 2026-10-30 under a message that said the gate stopped being red. A gate with no
      # caller cannot be red, and a gate that cannot be red is indistinguishable from a green one.
      - name: Stardew action-development gates
        id: stardew_action_development_gates
        if: ${{ !cancelled() }}
        # A step with no budget does not fail when it stops making progress; it stops the whole run.
        # This one did exactly that on 2026-11-03: it sat in `in_progress` for five hours after the
        # step above it had already failed, which also withheld every other job's log for the run.
        #
        # The long pole is `package-deterministic-tests`, the whole 52-file package suite run
        # sequentially through src/run-tests.mjs - not the five artefact checkers, which finish in
        # seconds. Measured on the development machine it exceeds 30 minutes, so 45 is not generous,
        # it is the smallest number that does not turn a slow suite into a false red. If this step
        # starts hitting the limit, the suite needs its own budget and possibly its own job; raising
        # this number is not the fix.
        timeout-minutes: 45
        run: pnpm --dir integrations/stardew/action-development action:ci
      # The integration suite's own source says no game, Host receiver or schema is involved, but its
      # project references the mod project, so the Stardew mod build package runs and requires a licensed
      # game folder that a hosted runner does not have. Gated on an explicitly configured game path rather
      # than stubbed: a fake game assembly would be evidence of nothing, and this suite belongs to the
      # game-attached lane when one is configured.
      - name: Stardew integration tests (game path configured)
        id: stardew_integration_tests
        if: ${{ !cancelled() && env.GAMEBUDDY_STARDEW_GAME_PATH != '' }}
        run: dotnet test integrations/stardew/tests/GameBuddy.Stardew.Integration.Tests --no-restore
      # Its runner builds GameBuddy.Stardew.csproj, so the mod build package runs and needs a licensed
      # game folder; measured locally as `stardew_action_test_launcher_failed` after a dotnet build of the
      # mod project. Same gate as the integration suite above.
      - name: Stardew action-development tests (game path configured)
        id: stardew_action_development_tests
        if: ${{ !cancelled() && env.GAMEBUDDY_STARDEW_GAME_PATH != '' }}
        run: pnpm --dir integrations/stardew/action-development test
      # Runner contract gates. A native-local runner is one action's live gate
      # entry point, and it can be structurally incapable of passing while its
      # own unit test stays green (the test builds a config in the same shape the
      # runner expects). Both gates are offline and together run in a few seconds.
      #   audit:*  static ratchet over runner source
      #   test:*   feeds each runner the config the fixture actually writes
      - run: pnpm audit:stardew-native-local-runner-contract
      - run: pnpm test:stardew-native-local-runner-contract
      - run: pnpm test:stardew-native-local-runner-fixture-contract
      # The discovery-coverage gate: a `Discover*` function that publishes some of a location's
      # entities but never reads the collection they are stored in. Two live defects had this exact
      # shape (mine stones in `objects` versus a `terrainFeatures`-only scan; furniture in
      # `furniture`, a collection the discovery never opened), and neither was visible from any
      # existing check. It parses the Mod's C# and compares every discovery against one declared
      # table of the collections its family's entities live in, so it needs no game folder and no
      # installed workspace - it runs here, beside the runner-contract gates, and its falsifier suite
      # rides the derived `test:tool-corpus` step.
      - name: Stardew discovery reads the collections its entities live in
        if: ${{ !cancelled() }}
        run: pnpm check:stardew-discovery-collection-coverage
      # The two suites above are immune to a failing step ahead of them; this keeps the THIRD reading
      # readable from the run itself, because "the job said failure" is exactly what let a never-run
      # compile gate pass for a whole commit. `steps.<id>.outcome` is empty for a step that never
      # started, so an absent step prints "did not run" rather than a blank cell.
      - name: Record C# suite outcomes
        if: always()
        # `windows-latest` defaults to PowerShell; the vendor CI this pattern comes from runs on
        # ubuntu, where `run:` is bash. The block below is bash, so the shell is named rather than
        # inherited from the runner's default.
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.csharp_compile.outcome }}
          CORE_TESTS_OUTCOME: ${{ steps.stardew_core_tests.outcome }}
          NOGAME_AUDIT_OUTCOME: ${{ steps.stardew_nogame_subset_audit.outcome }}
          NOGAME_TESTS_OUTCOME: ${{ steps.stardew_nogame_tests.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.stardew_integration_tests.outcome }}
          ACTION_DEV_OUTCOME: ${{ steps.stardew_action_development_tests.outcome }}
        run: |
          {
            echo "### Stardew - C# outcomes"
            echo
            echo "| step | outcome |"
            echo "| --- | --- |"
            echo "| Compile every tracked C# project | ${COMPILE_OUTCOME:-did not run} |"
            echo "| Core tests | ${CORE_TESTS_OUTCOME:-did not run} |"
            echo "| No-game subset matches the compiler | ${NOGAME_AUDIT_OUTCOME:-did not run} |"
            echo "| No-game test subset | ${NOGAME_TESTS_OUTCOME:-did not run} |"
            echo "| Integration tests (needs a game path) | ${INTEGRATION_OUTCOME:-did not run} |"
            echo "| Action-development tests (needs a game path) | ${ACTION_DEV_OUTCOME:-did not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
      # Enforces the property the suites rely on. Unreachable while they carry `!cancelled()`; if a
      # later edit re-gates one behind an earlier step, this fails with a named cause instead of
      # leaving the job to say "failure" with no suite result at all.
      - name: A suite that did not run is not a pass
        if: ${{ !cancelled() && (steps.stardew_core_tests.outcome == '' || steps.stardew_core_tests.outcome == 'skipped' || steps.stardew_nogame_tests.outcome == '' || steps.stardew_nogame_tests.outcome == 'skipped') }}
        shell: bash
        run: |
          echo "::error::a Stardew suite step did not run in this job; 'failure' with no suite result must never read as 'the suite passed'"
          exit 1

  # The Windows shell and the installer build here, and nowhere else: the host job covers
  # the compiled Host suite and the Stardew jobs cover the mod, core and integration
  # projects, so neither builds `desktop/`. Measured 2026-10-19: `GameBuddy.sln` did not hold
  # the launcher, its tests or the installer, and no workflow built either project.
  #
  # Each step is a named door of the packaging lane. The launcher Release bundle is the entry
  # `package-player-distribution.mjs` lays into the payload the player receives, and the
  # installer refuses a Release build without that payload (GBPAY001) while a Debug build
  # without it warns GBPAY002 and produces the uninstall-only artifact. Assembling a signed
  # Release Setup.exe - the archive it needs plus the certificate - stays in the protected
  # release lane's separately approved contract, not here.
  #
  # The launcher's own test suite deliberately does NOT run here: its fixture publishes a Host
  # production generation through the canonical publisher, so it runs in the host job, which
  # already has that workspace.
  desktop-shell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build desktop/GameBuddy.Desktop/GameBuddy.Desktop.csproj -c Release
      - run: dotnet build desktop/installer/GameBuddy.Setup -c Debug
