name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Build the vendored source before pnpm packages the local dependency.
      # Host production build hashes the packaged artifact against this output.
      - run: bun install --cwd vendor/magic-context --frozen-lockfile
      - run: bun run --cwd vendor/magic-context/packages/pi-plugin build
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:host-windows-test-preflight
      - run: pnpm test:host-windows-test-preflight
      - name: Validate Knip configuration
        run: pnpm test:knip-config
      - name: Run blocking Knip reachability reports
        run: node tools/run-knip-reports.mjs --output-dir "${{ runner.temp }}\gamebuddy-knip" --allowed-root "${{ runner.temp }}" --ledger tools/knip-finding-ledger.json
      - name: Upload Knip workspace report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: knip-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gamebuddy-knip/workspace.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Knip production report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: knip-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gamebuddy-knip/production.json
          if-no-files-found: error
          retention-days: 14
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:host-production-import-boundary
      - run: pnpm typecheck
      # This builds only the browser's contributor-quality bundle; ordinary CI
      # has no authority to assemble a Host production generation.
      - run: pnpm --filter @gamebuddy/dialogue-web build
      - run: pnpm test
      - run: node tools/verify-phase0b-host.mjs
      - run: pnpm dependency-audit
      - run: pnpm check:dependency-risk
      - run: git diff --exit-code -- third_party/sbom-node.json

  voice-gateway:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The gateway must consume an independently compiled and tested protocol.
      - run: pnpm --filter @gamebuddy/voice-protocol typecheck
      - run: pnpm --filter @gamebuddy/voice-protocol build
      - run: pnpm --filter @gamebuddy/voice-protocol test
      - run: pnpm --filter @gamebuddy/voice-gateway typecheck
      - run: pnpm --filter @gamebuddy/voice-gateway build
      - run: pnpm --filter @gamebuddy/voice-gateway test

  stardew-scaffold:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: pnpm install --frozen-lockfile
      - run: dotnet restore GameBuddy.sln --locked-mode
      # The Stardew-owned package selects every PR-safe deterministic check.
      # Missing licensed target artifacts remain named blocked evidence; this command
      # cannot select target publication, live fixtures, or game mutation.
      - run: pnpm --dir integrations/stardew/action-development action:ci
