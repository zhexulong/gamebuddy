name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Build the vendored source before pnpm packages the local dependency.
      # Host production build hashes the packaged artifact against this output.
      - run: bun install --cwd vendor/magic-context --frozen-lockfile
      - run: bun run --cwd vendor/magic-context/packages/pi-plugin build
      - run: pnpm install --frozen-lockfile
      # Source-only Farmhand projection checks; no licensed Stardew/SMAPI assemblies required.
      - run: pnpm test:stardew-action-projection
      - run: pnpm check:stardew-action-surface
      # P2C additionally requires GAMEBUDDY_STARDEW_GAME_PATH and licensed
      # target-version Stardew/SMAPI assemblies, so it is intentionally local-only.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:host-production-import-boundary
      # Workspace protocol declarations are emitted rather than checked in;
      # this isolated job must build them before Host resolves the dependency.
      - run: pnpm --filter @gamebuddy/voice-protocol build
      - run: pnpm typecheck
      # The production artifact only accepts a verified, repository-built
      # stale-lock helper pair; construct it before assembling the Host.
      - run: node host/scripts/build-windows-stale-lock-reclaimer.mjs
      - run: pnpm build
      # Requires the freshly assembled Host production generation: it launches
      # the shipped browser artifact against the one-listener P3 composition.
      - run: pnpm test:dialogue-web
      - run: pnpm test
      - run: node tools/verify-phase0b-host.mjs
      - run: pnpm dependency-audit
      - run: git diff --exit-code -- third_party/sbom-node.json

  voice-gateway:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The gateway must consume an independently compiled and tested protocol.
      - run: pnpm --filter @gamebuddy/voice-protocol typecheck
      - run: pnpm --filter @gamebuddy/voice-protocol build
      - run: pnpm --filter @gamebuddy/voice-protocol test
      - run: pnpm --filter @gamebuddy/voice-gateway typecheck
      - run: pnpm --filter @gamebuddy/voice-gateway build
      - run: pnpm --filter @gamebuddy/voice-gateway test

  stardew-scaffold:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: pnpm install --frozen-lockfile
      - run: dotnet restore GameBuddy.sln --locked-mode
      # GitHub-hosted runners do not have the licensed, target-version Stardew
      # and SMAPI assemblies required by ModBuildConfig. Do not substitute fake
      # assemblies: Release compilation remains a required local, target-version
      # gate via tools/build-stardew.ps1 before deployment or publication.
      - shell: pwsh
        run: ./tools/verify-stardew-scaffold.ps1
      # Static leaves run only source/policy assertions and never mutate the game or invoke action scripts.
      - run: pnpm test:stardew:static
      - shell: pwsh
        run: |
          node tools/verify-stardew-static.mjs
          if ($LASTEXITCODE -notin 0, 2) { exit $LASTEXITCODE }
