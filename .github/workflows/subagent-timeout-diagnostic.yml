name: Subagent timeout diagnostic

# Manual, diagnostic-only, temporary. The host job's `pnpm test` hit its per-file budget on
# dist-test/gameplay-task-subagent.test.js (600s, heartbeats clean, no test output because the
# runner buffers a file's stdout), while the same file finishes in 2s locally. Running it
# directly with a per-test timeout makes the stalling test name itself instead of the whole file.
# Delete once the fix lands. Nothing depends on it.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --cwd vendor/magic-context --frozen-lockfile
      - run: bun run --cwd vendor/magic-context/packages/pi-plugin build
      - run: pnpm --dir vendor/pi-koe install --frozen-lockfile
      - run: pnpm run build
        working-directory: vendor/pi-koe/packages/voice-protocol
      - run: pnpm install --frozen-lockfile
      - run: node host/scripts/build-windows-stale-lock-reclaimer.mjs
      - run: node host/scripts/build-windows-reparse-inspector.mjs
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore GameBuddy.sln --locked-mode
      - run: pnpm --dir host build:test
      # Per-test timeout of 60s, so the stalling test fails BY NAME instead of the whole file
      # burning its 600s budget. `--test-reporter=spec` prints each test as it finishes.
      - name: Run the file with a per-test timeout
        working-directory: host
        run: node --import ./scripts/compiled-test-bootstrap.mjs --test --test-concurrency=1 --test-timeout=60000 --test-reporter=spec dist-test/gameplay-task-subagent.test.js
        env:
          GAMEBUDDY_BUN_EXECUTABLE: ${{ steps.bun.outputs.bun-path }}
      - name: The runner's own view of the same file
        if: always()
        working-directory: host
        run: node scripts/run-tests.mjs
        env:
          GAMEBUDDY_BUN_EXECUTABLE: ${{ steps.bun.outputs.bun-path }}
        continue-on-error: true