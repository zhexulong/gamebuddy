# Game automation cadence (workflow_dispatch + a nightly schedule).
#
# WHY THIS WORKFLOW EXISTS
# ------------------------
# The game-automation blocks (`.pi/tools/game-automation-plan.md` §3) each had a repeatable
# entry point, but nothing ran them together and nothing ran them on any rhythm: a real defect
# on the HEAD of the game flow (installation discovery) stayed invisible because no step ran on
# a schedule. This workflow runs the cadence — `tools/run-stardew-automation-cadence.mjs`, the
# one pass that composes the block entries — and keeps its rollup. It runs NO product code of
# its own: the cadence composes the existing block entries, which drive the existing runners.
#
# HONESTY: WHAT A GITHUB-HOSTED RUNNER CAN AND CANNOT DO
# ------------------------------------------------------
# This workflow targets `windows-latest`, and a GitHub-hosted Windows runner has NO Stardew
# Valley install and probably no SMAPI. It therefore CANNOT run the live cadence, and the run
# below is expected to finish RED. That red is the honest result, not a failure of the runner:
#
#   * The cadence publishes `passed`, `blocked`, and - since the host verdict that follows - `unavailable`
#     for a machine that cannot host the blocks. On a game-less runner the machine-cannot-host fact
#     is B2's own `game_path_missing_smapi` (the batch refuses before launching anything when
#     `<game-path>\StardewModdingAPI.exe` is absent), so the rollup state is `unavailable` and its
#     `reasonCode` names the block (`cadence_block_unavailable:b2_action_gates`), with the block's own
#     code in `unavailableBlocks`. B3 then reports `cadence_block_verdict_missing` (the ladder died
#     before publishing where its result is), a missing verdict rather than a host fact.
#   * That is how the cadence DISTINGUISHES "this machine has no game" (`unavailable`) from "the
#     product failed" (`blocked`): the host codes are the composed blocks' own named refusals
#     (`MACHINE_CANNOT_HOST_REASONS` in `tools/run-stardew-automation-cadence.mjs`), and every other
#     refusal still reads `blocked`. Per the brief this workflow does NOT invent a game-presence
#     precheck: it runs the cadence and lets the cadence's own named blocker stand. There is no step
#     here that turns "no game" into a green pass, and none that turns it into a skip.
#   * A green run of this job would prove nothing, so the run step is NOT `continue-on-error`: a
#     blocked OR unavailable cadence exits non-zero and the job goes red. Read the reason code, not
#     the colour.
#   * The artifact upload is `if: always()`, so a red run still keeps the cadence's rollup (its
#     stdout JSON) and the per-block logs, which is where the named blocker actually lives.
#
# To get a REAL cadence, run this on a machine that has the game (a self-hosted runner), or
# dispatch it with the real `game-path` / `mods-path`. That machine additionally needs the
# cadence's own preconditions — a built Release bundle
# (`integrations/stardew/bin/Release/net6.0`), a built generation (`host/dist` / `dist-test`) for
# the B3 ladder, a live provider credential for B3, and a free `GameBuddyFixture*` save slot. The
# workflow does not build those; it surfaces the cadence's named refusal when one is missing.
#
# The cadence's own entries are node-only (they import `node:` + repo-local modules), so no
# workspace install is needed here to reach the cadence's fail-closed result.
name: game-automation-cadence
on:
  workflow_dispatch:
    inputs:
      cadence:
        description: >-
          nightly = B2 published-action pass + one B3 ladder scenario;
          release = B2 + all four B3 scenarios + both B4 shared-world actions
        type: choice
        options:
          - nightly
          - release
        default: nightly
      game-path:
        description: Absolute Stardew Valley install root on the RUNNER (a hosted runner has none)
        required: false
        default: "D:\\Steam\\steamapps\\common\\Stardew Valley"
      mods-path:
        description: Absolute Mods directory on the RUNNER
        required: false
        default: "D:\\Steam\\steamapps\\common\\Stardew Valley\\Mods"
      save-name:
        description: Disposable GameBuddyFixture* save slot the cadence may overwrite
        required: false
        default: GameBuddyFixtureCadence_445094166
      scenario:
        description: The one B3 ladder scenario a nightly cadence runs
        type: choice
        options:
          - morning_routine
          - memory_covenant
          - npc_social_and_presence
          - multiday_routine
        default: morning_routine
      expected-farmhand-id:
        description: The exact native farmhand id a release cadence's B4 block binds to (release only)
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
env:
  # A workflow_dispatch input wins; on the schedule the `inputs` context is empty, so the
  # literal after `||` is what a scheduled run uses. These are the cadence's documented defaults.
  GB_CADENCE: ${{ inputs.cadence || 'nightly' }}
  GB_GAME_PATH: ${{ inputs['game-path'] || 'D:\Steam\steamapps\common\Stardew Valley' }}
  GB_MODS_PATH: ${{ inputs['mods-path'] || 'D:\Steam\steamapps\common\Stardew Valley\Mods' }}
  GB_SAVE_NAME: ${{ inputs['save-name'] || 'GameBuddyFixtureCadence_445094166' }}
  GB_SCENARIO: ${{ inputs.scenario || 'morning_routine' }}
  GB_FARMHAND_ID: ${{ inputs['expected-farmhand-id'] }}
jobs:
  cadence:
    runs-on: windows-latest
    # The nightly bound is the cadence's own harness bounds: B2 is one launch per published action
    # (the plan calls a full pass "an overnight job") and B3 is the ladder's run budget. GitHub-
    # hosted runners cap a job at 360 minutes, so a full pass needs a self-hosted runner.
    timeout-minutes: 720
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run the cadence (names its own blocker; a hosted runner has no game)
        shell: pwsh
        run: |
          $runDir = Join-Path $env:GITHUB_WORKSPACE ".tmp\game-automation-cadence"
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          $cadenceArgs = @(
            "tools/run-stardew-automation-cadence.mjs",
            "--cadence", $env:GB_CADENCE,
            "--game-path", $env:GB_GAME_PATH,
            "--mods-path", $env:GB_MODS_PATH,
            "--save-name", $env:GB_SAVE_NAME,
            "--scenario", $env:GB_SCENARIO,
            "--run-dir", $runDir
          )
          if ($env:GB_FARMHAND_ID) { $cadenceArgs += @("--expected-farmhand-id", $env:GB_FARMHAND_ID) }
          node @cadenceArgs 2>&1 | Tee-Object -FilePath (Join-Path $runDir "cadence.log")
          $code = $LASTEXITCODE
          # Print the verdict as one plain line: `passed`, `blocked`, or the `unavailable` a host-less
          # runner gets (read the reason, not the colour).
          $rollup = Get-Content (Join-Path $runDir "cadence.log") | Where-Object { $_.StartsWith("{") } | Select-Object -Last 1
          if ($rollup) {
            $verdict = $rollup | ConvertFrom-Json
            Write-Host "cadence verdict: state=$($verdict.state) reasonCode=$($verdict.reasonCode)"
          }
          exit $code

      - name: Upload the cadence rollup (always, so a named blocker survives)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-automation-cadence-rollup
          path: .tmp/game-automation-cadence
          if-no-files-found: warn
          retention-days: 14
