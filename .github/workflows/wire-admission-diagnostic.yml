name: Wire admission diagnostic

# Manual, diagnostic-only. The `host` job's wire-fixture batch cannot be observed while an
# earlier gate is red (2026-10-17: the four `multiday-baseline`/`multiday-loop` exports from
# Lane G0 stop it at `Check Knip reachability`). This runs ONLY the fixture that names the
# root-admission refusal, so the probe's output is reachable without waiting on unrelated
# gates. It is not a release gate and nothing depends on it.
on:
  workflow_dispatch:

jobs:
  wire-admission:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --cwd vendor/magic-context --frozen-lockfile
      - run: bun run --cwd vendor/magic-context/packages/pi-plugin build
      - run: pnpm --dir vendor/pi-koe install --frozen-lockfile
      - run: pnpm run build
        working-directory: vendor/pi-koe/packages/voice-protocol
      - run: pnpm install --frozen-lockfile
      # The fixture's compiled-test bootstrap refuses to run without the fixed helper pair.
      - run: node host/scripts/build-windows-stale-lock-reclaimer.mjs
      - run: node host/scripts/build-windows-reparse-inspector.mjs
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: pnpm --dir host build:test
      # Run the batch's FIRST file alone, which is where CI refuses. Its stderr carries the
      # probe lines, and the runner prints the child's message under the failing test.
      - name: Wire admission probe
        run: node --import ./scripts/compiled-test-bootstrap.mjs --test --test-concurrency=1 dist-test/bootstrap/wire/desktop-runtime-bootstrap.internal.test.js
        working-directory: host
        env:
          GAMEBUDDY_BUN_EXECUTABLE: ${{ steps.bun.outputs.bun-path }}
