name: Wire admission diagnostic

# Manual, diagnostic-only, and temporary: it exists to observe the wire-fixture batch
# without waiting on the host job's other gates. Delete it once that batch is green in the
# host job. Nothing depends on it and no release gate consumes it.
on:
  workflow_dispatch:

jobs:
  wire-admission:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --cwd vendor/magic-context --frozen-lockfile
      - run: bun run --cwd vendor/magic-context/packages/pi-plugin build
      - run: pnpm --dir vendor/pi-koe install --frozen-lockfile
      - run: pnpm run build
        working-directory: vendor/pi-koe/packages/voice-protocol
      - run: pnpm install --frozen-lockfile
      # The fixture's compiled-test bootstrap refuses to run without the fixed helper pair.
      - run: node host/scripts/build-windows-stale-lock-reclaimer.mjs
      - run: node host/scripts/build-windows-reparse-inspector.mjs
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: pnpm --dir host build:test
      # Why the fixture normalizes the owner field: this runner's directories belong to
      # BUILTIN\Administrators while the process runs as runneradmin, so no root created here
      # can satisfy the current-user-owner predicate.
      - name: Root ownership facts
        shell: pwsh
        run: |
          Write-Host "whoami: $(whoami)"
          Write-Host ("token_user: " + [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value)
          Write-Host ("token_owner: " + [System.Security.Principal.WindowsIdentity]::GetCurrent().Owner.Value)
          Write-Host ("owner_of_dir " + $env:LOCALAPPDATA + " => " + (Get-Acl -LiteralPath $env:LOCALAPPDATA).Owner)
      - name: Wire admission probe
        run: node --import ./scripts/compiled-test-bootstrap.mjs --test --test-concurrency=1 dist-test/bootstrap/wire/desktop-runtime-bootstrap.internal.test.js
        working-directory: host
