name: Wire admission diagnostic

# Manual, diagnostic-only. The `host` job's wire-fixture batch cannot be observed while an
# earlier gate is red. This runs ONLY that fixture, so the admission probe's output and the
# root-ownership facts are reachable without waiting on unrelated gates. It is not a release
# gate and nothing depends on it.
on:
  workflow_dispatch:

jobs:
  wire-admission:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --cwd vendor/magic-context --frozen-lockfile
      - run: bun run --cwd vendor/magic-context/packages/pi-plugin build
      - run: pnpm --dir vendor/pi-koe install --frozen-lockfile
      - run: pnpm run build
        working-directory: vendor/pi-koe/packages/voice-protocol
      - run: pnpm install --frozen-lockfile
      # The fixture's compiled-test bootstrap refuses to run without the fixed helper pair.
      - run: node host/scripts/build-windows-stale-lock-reclaimer.mjs
      - run: node host/scripts/build-windows-reparse-inspector.mjs
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: pnpm --dir host build:test
      # What the roots' owners actually are on this runner, and whether a directory created
      # under the profile differs from one created under RUNNER_TEMP.
      - name: Root ownership facts
        shell: pwsh
        run: |
          Write-Host "whoami: $(whoami)"
          Write-Host "runner_temp: $env:RUNNER_TEMP"
          Write-Host "localappdata: $env:LOCALAPPDATA"
          Write-Host "userprofile: $env:USERPROFILE"
          foreach ($p in @($env:RUNNER_TEMP, $env:LOCALAPPDATA, $env:USERPROFILE)) {
            if ([string]::IsNullOrEmpty($p)) { continue }
            Write-Host ("owner_of_dir " + $p + " => " + (Get-Acl -LiteralPath $p).Owner)
          }
          $t = Join-Path $env:RUNNER_TEMP ("owner-probe-" + (Get-Random))
          $l = Join-Path $env:LOCALAPPDATA ("owner-probe-" + (Get-Random))
          New-Item -ItemType Directory -Force -Path $t | Out-Null
          New-Item -ItemType Directory -Force -Path $l | Out-Null
          Write-Host ("owner_of_new_in_temp => " + (Get-Acl -LiteralPath $t).Owner)
          Write-Host ("owner_of_new_in_localappdata => " + (Get-Acl -LiteralPath $l).Owner)
          Remove-Item -Recurse -Force $t, $l
      - name: Wire admission probe (RUNNER_TEMP)
        run: node --import ./scripts/compiled-test-bootstrap.mjs --test --test-concurrency=1 dist-test/bootstrap/wire/desktop-runtime-bootstrap.internal.test.js
        working-directory: host
      # Falsification test: the same fixture with TEMP/TMP under the profile instead. If this
      # batch goes green, the refusal is the OWNER of the RUNNER_TEMP tree, not anything the
      # product or the fixture asserts about shapes, chains or volumes.
      - name: Wire admission probe (profile-backed TEMP)
        shell: pwsh
        working-directory: host
        run: |
          $temp = Join-Path $env:LOCALAPPDATA "gb-wire-probe-temp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $env:TEMP = $temp
          $env:TMP = $temp
          Write-Host ("probe temp owner: " + (Get-Acl -LiteralPath $temp).Owner)
          node --import ./scripts/compiled-test-bootstrap.mjs --test --test-concurrency=1 dist-test/bootstrap/wire/desktop-runtime-bootstrap.internal.test.js
