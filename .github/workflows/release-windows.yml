name: GameBuddy Protected Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-release:
    # YAML cannot protect tags. Repository administrators must protect the v* tag
    # namespace and require approval for the gamebuddy-production-release environment.
    if: >-
      github.repository == 'zhexulong/gamebuddy' &&
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    environment: gamebuddy-production-release
    env:
      # Bounded identity facts only; the acquisition module owns the fixed URL,
      # digests, and scratch location and rejects any caller override.
      GAMEBUDDY_RELEASE_ENVIRONMENT: gamebuddy-production-release
      GAMEBUDDY_RELEASE_REF: ${{ github.ref }}
    steps:
      # vendor/magic-context and vendor/pi-koe are git submodules, and the job
      # below builds and consumes both. Without `submodules: recursive` a fresh
      # checkout leaves them empty and the bun/pnpm steps fail.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd vendor/magic-context --frozen-lockfile
      - run: bun run --cwd vendor/magic-context/packages/pi-plugin build
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:host-windows-test-preflight
      - run: pnpm test:host-windows-test-preflight
      # Repository-wide formatting/linting belongs to ordinary contributor CI.
      # This protected lane validates the fixed Host release composition only.
      - run: pnpm check:host-production-import-boundary
      # Chat/Game surface decoupling guard: fails while the documented drift
      # ledger is non-empty; Loop 2 must cut the last edges to go green.
      - run: pnpm check:dialogue-web-boundaries
      # Build the split-out pi-koe protocol before Host typecheck so a clean
      # checkout never depends on stale generated protocol declarations.
      # pi-koe is the Voice repository mounted as vendor/pi-koe (git submodule).
      - run: pnpm run build
        working-directory: vendor/pi-koe/packages/voice-protocol
      - run: pnpm typecheck
      # Host tests mint only repository-built, fixed Windows helper pairs; they
      # never use an unverified production generation.
      - run: node host/scripts/build-windows-stale-lock-reclaimer.mjs
      - run: node host/scripts/build-windows-reparse-inspector.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - run: dotnet restore integrations/stardew/tests/GameBuddy.Stardew.Core.Tests/GameBuddy.Stardew.Core.Tests.csproj
      - run: dotnet restore integrations/stardew/tests/GameBuddy.Stardew.Integration.Tests/GameBuddy.Stardew.Integration.Tests.csproj
      - run: pnpm --dir host test
        env:
          GAMEBUDDY_BUN_EXECUTABLE: ${{ steps.bun.outputs.bun-path }}
      # This is the sole network-acquisition entry. It fails closed unless the
      # protected workflow identity, tag grammar, Windows x64 runner and release
      # environment marker all match. Installer assembly, certificate work, and
      # distribution upload are blocked pending their separately approved contract.
      - run: pnpm --dir host build:release
      - run: pnpm --dir host check:production-artifact
      # Tavern management P9 live evidence, run against the generation this job
      # just built and verified. The evidence runner mounts the real management
      # composition on a fresh gate-owned root and performs every operation the
      # mounted profile declares (including the reviewed ST-card import
      # pipeline) against the authenticated HTTP surface; the recorder converts
      # its content-free outcomes into the release gate's operation-to-evidence
      # mapping and writes the measured profile next to it. Both derive their
      # operation vocabulary from the composition source, so a new surface never
      # needs a hand-edited fixture here.
      - name: Tavern management operation evidence
        run: node tools/run-tavern-management-operation-evidence.mjs --outcomes tavern-ui-outcomes.json
        env:
          # The gate drives three real embedded provider turns; without the
          # environment credential they report blocked and the verdict stays
          # inconclusive rather than passing.
          CPA_OAI_API_KEY: ${{ secrets.CPA_OAI_API_KEY }}
      - name: Record Tavern operation evidence mapping
        run: node tools/record-tavern-ui-operation-evidence.mjs tavern-ui-outcomes.json tavern-operation-evidence.json
      # The single Chat/Tavern release verdict: automated prerequisites plus
      # three real provider turns plus the complete mounted-operation mapping.
      # A non-passed verdict exits 2, so this step fails closed.
      - name: Tavern release live gate
        run: node tools/run-tavern-release-live-gate.mjs --orchestrate --mounted-profile tavern-operation-evidence.json.profile.json --operation-evidence-mapping tavern-operation-evidence.json --report tavern-release-live-gate.json
        env:
          CPA_OAI_API_KEY: ${{ secrets.CPA_OAI_API_KEY }}
      # The player-visible side of the same release claim: the mounted browser
      # journeys mount the real management composition on a fresh root and drive
      # the shipped UI in Chromium (draft/rename, World Info bind and pending
      # state, two-page consistency, stale-revision conflicts, zh-CN at 375x667,
      # connection create/test/activate/model, Characters CRUD, lifecycle
      # retention, and the reviewed card import end to end). They resolve their
      # generation from GAMEBUDDY_TAVERN_BROWSER_OUTPUT_ROOT, which without this
      # step defaults to host/dist - a checked-in directory whose generation is
      # older than the code under test, which is why they fail to load locally.
      - name: Install the browser journeys' Chromium
        run: pnpm --dir dialogue-web exec playwright install --with-deps chromium
      - name: Tavern mounted browser journeys
        # Exactly the two suites that need no game: the management surface and the
        # Chat surface. The composed-reference-game and installation-discovery
        # specs require a real Stardew installation and belong to that gate.
        run: pnpm --dir dialogue-web exec playwright test tests/reference-pipeline-browser.spec.ts tests/management-pipeline-browser.spec.ts --project=chromium --workers=1
        env:
          GAMEBUDDY_TAVERN_BROWSER_OUTPUT_ROOT: ${{ github.workspace }}/host/dist
      # Screenshots, traces and the page snapshots of any failure, so a broken
      # journey is diagnosable from the run without a local reproduction.
      - name: Upload browser journey failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tavern-browser-journey-failures
          if-no-files-found: ignore
          path: |
            dialogue-web/test-results
            dialogue-web/playwright-report
      # The gate report and the mapping it was decided on are the release's
      # Chat/Tavern live claim; keep them with the run instead of a runner scratch
      # path. Uploaded on every outcome so a failure is still auditable.
      - name: Upload Tavern live gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tavern-release-live-evidence
          if-no-files-found: warn
          path: |
            tavern-ui-outcomes.json
            tavern-operation-evidence.json
            tavern-operation-evidence.json.profile.json
            tavern-release-live-gate.json
      # Recovery cleanup is repository-owned and derives only this exact protected
      # workflow run root. It never accepts a path or scans TEMP. The native
      # inspector remains the authority for Windows reparse-chain verification.
      - name: Remove this release run's acquisition scratch
        if: always()
        run: node host/scripts/release-owned-scratch-cleanup.mjs
