name: GameBuddy Protected Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-release:
    # YAML cannot protect tags. Repository administrators must protect the v* tag
    # namespace and require approval for the gamebuddy-production-release environment.
    if: >-
      github.repository == 'zhexulong/gamebuddy' &&
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    environment: gamebuddy-production-release
    env:
      # Bounded identity facts only; the acquisition module owns the fixed URL,
      # digests, and scratch location and rejects any caller override.
      GAMEBUDDY_RELEASE_ENVIRONMENT: gamebuddy-production-release
      GAMEBUDDY_RELEASE_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd vendor/magic-context --frozen-lockfile
      - run: bun run --cwd vendor/magic-context/packages/pi-plugin build
      - run: pnpm install --frozen-lockfile
      # Repository-wide formatting/linting belongs to ordinary contributor CI.
      # This protected lane validates the fixed Host release composition only.
      - run: pnpm check:host-production-import-boundary
      # Build the workspace-owned protocol before Host typecheck so a clean
      # checkout never depends on stale generated protocol declarations.
      - run: pnpm --filter @gamebuddy/voice-protocol typecheck
      - run: pnpm --filter @gamebuddy/voice-protocol build
      - run: pnpm typecheck
      # Host tests that exercise durable path locks mint only this repository-built,
      # fixed helper pair; they never use an unverified production generation.
      - run: node host/scripts/build-windows-stale-lock-reclaimer.mjs
      - run: pnpm --dir host test
        env:
          GAMEBUDDY_BUN_EXECUTABLE: ${{ steps.bun.outputs.bun-path }}
          GAMEBUDDY_HOST_TEST_COMPILED_BATCH_SIZE: "5"
      # This is the sole network-acquisition entry. It fails closed unless the
      # protected workflow identity, tag grammar, Windows x64 runner and release
      # environment marker all match. Installer assembly, certificate work, and
      # distribution upload are blocked pending their separately approved contract.
      - run: pnpm --dir host build:release
      - run: pnpm --dir host check:production-artifact
      # Recovery cleanup is repository-owned and derives only this exact protected
      # workflow run root. It never accepts a path or scans TEMP. The native
      # inspector remains the authority for Windows reparse-chain verification.
      - name: Remove this release run's acquisition scratch
        if: always()
        run: node host/scripts/release-owned-scratch-cleanup.mjs
