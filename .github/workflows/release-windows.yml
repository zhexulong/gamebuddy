name: GameBuddy Protected Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-release:
    # YAML cannot protect tags. Repository administrators must protect the v* tag
    # namespace and require approval for the gamebuddy-production-release environment.
    #
    # This job holds NO provider credential. The three live steps that drove real embedded
    # provider turns (Tavern management operation evidence, the Tavern release live gate, the
    # Companion memory fold gate) are gone, together with the CPA_OAI_API_KEY environment they
    # read; the claim they carried is read from the committed evidence under
    # tools/fixtures/live-evidence, and `tools/check-release-live-evidence.mjs` validates each
    # surface's pin against this tree and its freshness. That is a weaker declaration than a
    # provider turn measured during this release, and the step below records it as such.
    if: >-
      github.repository == 'zhexulong/gamebuddy' &&
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    environment: gamebuddy-production-release
    env:
      # Bounded identity facts only; the acquisition module owns the fixed URL,
      # digests, and scratch location and rejects any caller override.
      GAMEBUDDY_RELEASE_ENVIRONMENT: gamebuddy-production-release
      GAMEBUDDY_RELEASE_REF: ${{ github.ref }}
      # A boolean, not the secret. `secrets` may not be read in a step-level `if:` - GitHub rejects the file with
      # "Unrecognized named-value: 'secrets'" - so the emptiness test happens here, where the context is allowed, and the
      # conditions below read this instead.
      HAS_SIGNING_CERTIFICATE: ${{ secrets.GAMEBUDDY_SIGNING_CERTIFICATE_PFX_BASE64 != '' }}
    steps:
      # vendor/magic-context and vendor/pi-koe are git submodules, and the job
      # below builds and consumes both. Without `submodules: recursive` a fresh
      # checkout leaves them empty and the bun/pnpm steps fail.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --cwd vendor/magic-context --frozen-lockfile
      - run: pnpm build:magic-context
      # pi-koe is the Voice repository mounted as vendor/pi-koe (git submodule).
      # Its protocol package must be BUILT BEFORE the root install: the root
      # `pnpm install` snapshots the `file:` dependency into the pnpm store AT
      # RESOLUTION TIME, and `dist/` is gitignored in the submodule, so a fresh
      # checkout snapshots a store copy with no dist. Building later (inside
      # `typecheck:all`) only writes into the source tree, never the store copy,
      # which is why host typecheck failed with TS2307 on @gamebuddy/voice-protocol
      # (measured on tag v0.1.0-rc.70).
      - run: pnpm --dir vendor/pi-koe install --frozen-lockfile
      - run: pnpm run build
        working-directory: vendor/pi-koe/packages/voice-protocol
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:host-windows-test-preflight
      - run: pnpm test:host-windows-test-preflight
      # Repository-wide formatting/linting belongs to ordinary contributor CI.
      # This protected lane validates the fixed Host release composition only.
      - run: pnpm check:host-production-import-boundary
      # Chat/Game surface decoupling guard: fails while the documented drift
      # ledger is non-empty; Loop 2 must cut the last edges to go green.
      - run: pnpm check:dialogue-web-boundaries
      - run: pnpm typecheck
      # The artifact gate zone, named explicitly. dialogue-web's own `test` is only
      # its static zone, so this zone runs nowhere unless a caller names it - and
      # this lane is the one that ships the browser artifact whose manifest, hash
      # and symlink boundaries it verifies (built here from this same tree, into
      # its own private staging directory). The static zone stays ordinary
      # contributor CI's, and the mounted zone is named below. The zone's manifest
      # test reads the emitted dist/, so this lane must build it first, exactly as
      # ordinary contributor CI does before naming the same zone.
      - run: pnpm --filter @gamebuddy/dialogue-web build
      - run: pnpm --filter @gamebuddy/dialogue-web test:artifact
      # Host tests mint only repository-built, fixed Windows helper pairs; they
      # never use an unverified production generation.
      - run: node host/scripts/build-windows-stale-lock-reclaimer.mjs
      - run: node host/scripts/build-windows-reparse-inspector.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - run: dotnet restore integrations/stardew/tests/GameBuddy.Stardew.Core.Tests/GameBuddy.Stardew.Core.Tests.csproj
      - run: dotnet restore integrations/stardew/tests/GameBuddy.Stardew.Integration.Tests/GameBuddy.Stardew.Integration.Tests.csproj
      - run: pnpm --dir host test
        env:
          GAMEBUDDY_BUN_EXECUTABLE: ${{ steps.bun.outputs.bun-path }}
      # This is the sole network-acquisition entry. It fails closed unless the
      # protected workflow identity, tag grammar, Windows x64 runner and release
      # environment marker all match.
      - run: pnpm --dir host build:release
      - run: pnpm --dir host check:production-artifact

      # The certificate the signing target names. A hosted runner has none, so without this step the release lane fails at
      # `GBSIGN002` for a reason that says nothing about the artifact. The thumbprint is read from the certificate that
      # was imported, never from a second secret that could disagree with it.
      #
      # The PFX is written to a temporary file, imported into the current user's store, and the file removed in the same
      # step. It is never echoed, never exported, and never left on disk for a later step to read.
      - name: Import the release signing certificate
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.GAMEBUDDY_SIGNING_CERTIFICATE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.GAMEBUDDY_SIGNING_CERTIFICATE_PFX_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'gamebuddy-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
            $secure = ConvertTo-SecureString -String $env:PFX_PASSWORD -AsSecureString -Force
            $imported = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $secure
            # The target reads this from the environment; an empty value is the fail-closed case.
            "GAMEBUDDY_SIGNING_THUMBPRINT=$($imported.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }

      # The artifact a player actually downloads, assembled from the generation this job just verified: the launcher
      # published self-contained, the payload sealed by the existing completeness/leak authority, and Setup.exe built
      # in Release - the configuration whose own MSBuild target refuses to produce an unsigned artifact. The signing
      # identity comes from the protected environment and is never defaulted; without it this step fails with
      # `signing_identity_required` rather than publishing something nobody signed.
      - name: Assemble the player release (signed)
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        run: >-
          node host/scripts/build-release-installer.mjs
          --generation-output host/dist
          --out desktop/dist/release
          --version "${{ github.ref_name }}"
          --repository "${{ github.repository }}"
        env:
          GAMEBUDDY_TIMESTAMP_URL: ${{ secrets.GAMEBUDDY_TIMESTAMP_URL }}
          GAMEBUDDY_SIGNTOOL: ${{ secrets.GAMEBUDDY_SIGNTOOL }}

      # No certificate: the artifact is built in the configuration that is allowed to exist unsigned, and the manifest
      # records that it is unsigned. Publication accepts it only because this lane says so - see `--allow-unsigned`.
      - name: Assemble the player release (unsigned)
        if: env.HAS_SIGNING_CERTIFICATE == 'false'
        run: >-
          node host/scripts/build-release-installer.mjs
          --generation-output host/dist
          --out desktop/dist/release
          --version "${{ github.ref_name }}"
          --repository "${{ github.repository }}"
          --unsigned

      # The two artifact gates run HERE, not in `ci.yml`, because this is the only job that can satisfy them.
      # `build-production-artifact` refuses without a verified bundled runtime
      # (`verified_bundled_runtime_input_required`, node-runtime-release-acquisition.mjs:172), so a fresh generation
      # cannot be produced on a developer machine or in the `gates` job - and `host/dist` is gitignored, so a clean
      # checkout holds no generation at all. Running `check-production-artifact` there made that job permanently red:
      # a gate that can never pass is the same defect as a gate nobody calls.
      # `check-release-generation-self-contained` additionally compares the generation against every module
      # `production-artifact.config.json` declares, which is the half that named
      # `composition/companion-session-reflection.js` when this artifact was frozen a day before that module landed.
      - name: Verify the generation the release was assembled from
        run: node tools/check-release-generation-self-contained.mjs

      - name: Verify the published generation completely
        run: node host/scripts/check-production-artifact.mjs

      # The manifest is held to the bytes it describes, and to the generation the pointer names, so a release cannot
      # claim an artifact this job did not build.
      - name: Verify the release manifest
        run: >-
          node host/scripts/check-release-manifest.mjs
          desktop/dist/release/release-manifest.json
          host/dist
        env:
          GAMEBUDDY_SIGNTOOL: ${{ secrets.GAMEBUDDY_SIGNTOOL }}

      # Publication refuses an unsigned artifact, and a tag that disagrees with the manifest's version, so a release
      # cannot be published under a name it does not have.
      - name: Prepare the publication
        run: >-
          node host/scripts/prepare-release-publication.mjs
          desktop/dist/release/release-manifest.json
          "${{ github.ref_name }}"
          host/dist --allow-unsigned > desktop/dist/release/publication.json
        env:
          GAMEBUDDY_SIGNTOOL: ${{ secrets.GAMEBUDDY_SIGNTOOL }}

      # Handed to the publishing job instead of being pushed from here: this job is read-only on the repository.
      - name: Upload the assembled release
        uses: actions/upload-artifact@v4
        with:
          name: gamebuddy-player-release
          if-no-files-found: error
          path: |
            desktop/dist/release/GameBuddy.Setup.exe
            desktop/dist/release/payload.zip
            desktop/dist/release/release-manifest.json
            desktop/dist/release/publication.json
      # The release's Chat/Tavern and memory claim is READ here, not produced. Three live steps
      # used to drive real embedded provider turns in this job - the management operation evidence,
      # the release live gate and the companion memory fold - each reading CPA_OAI_API_KEY, so the
      # lane that publishes a player artifact could not run without a provider credential. They
      # are gone with it. What replaces them is the committed evidence under
      # tools/fixtures/live-evidence: one file per surface, naming the commit it describes, when it
      # was captured, and what it measured. The gate refuses evidence pinned to a commit this
      # release does not contain, evidence captured too far from that commit to describe it, and a
      # surface whose own verdict is failed; it names every surface nobody has measured, on every
      # run, instead of reading an absent measurement as a pass.
      - name: Verify the committed live evidence
        run: node tools/check-release-live-evidence.mjs
      # The player-visible side of the same release claim, run as the mounted gate
      # zone. The zone's corpus is the whole tests/ journey directory, so the
      # journeys the removed management/Chat shells used to carry (draft/rename,
      # World Info bind and pending state, two-page consistency, stale-revision
      # conflicts, zh-CN at 375x667, connection create/test/activate/model,
      # Characters CRUD, lifecycle retention, the reviewed card import, the Chat
      # Stop journey) run through the suites that own them now
      # (management-surface-panels.spec.ts, character-card-import.spec.ts,
      # chat-selection.spec.ts, sending-and-composer.spec.ts),
      # and a renamed or re-added spec joins this gate instead of leaving a
      # hand-written file list naming suites that no longer exist. The two provider
      # journeys from the removed companion-turn suite have no home yet; they are
      # reported rather than silently dropped.
      - name: Install the browser journeys' Chromium
        run: pnpm --dir dialogue-web exec playwright install --with-deps chromium
      - name: Tavern mounted browser journeys
        run: pnpm --filter @gamebuddy/dialogue-web test:mounted
      # The frontend criteria, and the corpus itself, as one gate. It runs the
      # mounted zone's own corpus again - the whole dialogue-web/tests journey
      # directory, so no hand-written file list can name a suite that was deleted -
      # and requires that no journey was silently skipped or excluded, that every
      # declared criterion holds (accessibility baseline, keyboard reach, layout
      # floor, a quiet walk), and that the headline journeys are still there.
      # Authority for the obligations:
      # tools/fixtures/tavern-frontend-conformance/required-suites.json, executed by
      # dialogue-web/tests/frontend-criteria.ts.
      #
      # This step keeps running without a provider credential, and that is a measured fact rather
      # than an assumption: the contract's `credentialTestTitles` is empty and the only mention of
      # CPA_OAI_API_KEY under dialogue-web/tests is a prose comment (i18n.test.mjs:181), so no
      # journey in this corpus skips on a missing credential and nothing downgrades to a declared
      # skip. A journey that does start skipping still fails, which is the gate working as designed.
      - name: Tavern frontend conformance gate
        run: node tools/run-tavern-frontend-conformance.mjs --report tavern-frontend-conformance.json
      # Screenshots, traces and the page snapshots of any failure, so a broken
      # journey is diagnosable from the run without a local reproduction.
      - name: Upload browser journey failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tavern-browser-journey-failures
          if-no-files-found: ignore
          path: |
            dialogue-web/test-results
            dialogue-web/playwright-report
      # The frontend criteria report is the one live artifact this job still produces for the
      # Chat/Tavern claim, so it is kept with the run instead of a runner scratch path. Uploaded on
      # every outcome so a failure is still auditable. The management outcomes, the operation
      # mapping, the release live gate verdict and the memory fold report used to be here too; they
      # are committed evidence now (tools/fixtures/live-evidence), not run outputs.
      - name: Upload the frontend criteria report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tavern-frontend-conformance
          if-no-files-found: warn
          path: tavern-frontend-conformance.json
      # Recovery cleanup is repository-owned and derives only this exact protected
      # workflow run root. It never accepts a path or scans TEMP. The native
      # inspector remains the authority for Windows reparse-chain verification.
      - name: Remove this release run's acquisition scratch
        if: always()
        run: node host/scripts/release-owned-scratch-cleanup.mjs

  publish-release:
    # The only job with write access to the repository: it publishes assets and nothing else.
    needs: host-release
    # A tag push, not a manual dispatch: a dispatch may assemble, but only a tag names the version a player downloads.
    if: >-
      github.repository == 'zhexulong/gamebuddy' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: gamebuddy-production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the scripts are needed: the artifact arrives as an artifact, not from a build.
          sparse-checkout: host/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - name: Download the assembled release
        uses: actions/download-artifact@v4
        with:
          name: gamebuddy-player-release
          path: release
      # Re-verified here rather than trusted from the build job: the bytes this job publishes are the bytes it checked,
      # so a truncated or swapped artifact fails before it becomes a download.
      - name: Verify the release manifest again
        run: node host/scripts/check-release-manifest.mjs release/release-manifest.json
        env:
          GAMEBUDDY_SIGNTOOL: ${{ secrets.GAMEBUDDY_SIGNTOOL }}
      # Refuses an unsigned artifact and a tag that disagrees with the manifest's version, so a release cannot be
      # published under a name it does not have.
      - name: Prepare the publication
        run: >-
          node host/scripts/prepare-release-publication.mjs
          release/release-manifest.json
          "${{ github.ref_name }}" --allow-unsigned > release/publication.json
        env:
          GAMEBUDDY_SIGNTOOL: ${{ secrets.GAMEBUDDY_SIGNTOOL }}
      # `gh` with the runner's own token, not a third-party release action: the repository already treats this lane as
      # protected, and an action that can write releases would widen what compromising that action reaches.
      - name: Publish the release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $publication = Get-Content -Raw release/publication.json | ConvertFrom-Json
          $publication.body | Set-Content -Encoding utf8 release/notes.md
          # A tag is published once; a re-run edits the existing release and re-uploads with --clobber instead of
          # failing the lane on a retry.
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "${{ github.ref_name }}" --title "GameBuddy $($publication.version)" --notes-file release/notes.md
          } else {
            gh release create "${{ github.ref_name }}" --title "GameBuddy $($publication.version)" --notes-file release/notes.md
          }
          foreach ($asset in $publication.assets) {
            gh release upload "${{ github.ref_name }}" $asset --clobber
          }
