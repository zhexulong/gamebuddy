packages:
  - packages/*
  - host
  - dialogue-web
  - integrations/stardew/action-development
  # Project-maintained Magic Context fork. Kept out of the main workspace so
  # its Bun build/runtime remains isolated from the GameBuddy Node workspace.
  - '!vendor/magic-context/**'
  # pi-koe is the split-out Voice repository (see design/domains/voice). Its
  # protocol package is consumed through the submodule by file: reference in
  # host/package.json; the repository root is a pnpm workspace itself, so it
  # stays out of the main workspace to avoid nested-workspace conflicts.

  # Phase 0B intentionally disables optional native/model build scripts. Magic
  # Context runs with embeddings off; no optional binary is approved implicitly.
allowBuilds:
  '@ast-grep/cli': true
  '@google/genai': false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  tree-sitter: true
  tree-sitter-c-sharp: true

minimumReleaseAgeExclude:
  - '@earendil-works/chord@1.0.0'
  - '@earendil-works/pi-agent-core@1.0.0'
  - '@earendil-works/pi-ai@1.0.0'
  - '@earendil-works/pi-codemode@1.0.0'
  - '@earendil-works/pi-coding-agent@1.0.0'
  - '@earendil-works/pi-mcp@1.0.0'
  - '@earendil-works/pi-telemetry@1.0.0'
  - '@earendil-works/pi-tui@1.0.0'
  - '@earendil-works/pi-agent-core@1.2.0'
  - '@earendil-works/pi-ai@1.2.0'
  - '@earendil-works/pi-codemode@1.2.0'
  - '@earendil-works/pi-coding-agent@1.2.0'
  - '@earendil-works/pi-mcp@1.2.0'
  - '@earendil-works/pi-telemetry@1.2.0'
  - '@earendil-works/pi-tui@1.2.0'

overrides:
  # The Pi runtime is pinned as a set. pi's own ranges are carets (`@earendil-works/pi-ai": "^1.1.0"`),
  # so a bare bump of the entry package silently pulls the next minor of every sibling - and the
  # workspace's own supply-chain policy (minimumReleaseAge) then refuses the install, because those
  # siblings were published hours ago. The five packages are one runtime and are upgraded together.
  '@earendil-works/pi-agent-core': 1.2.0
  '@earendil-works/pi-ai': 1.2.0
  '@earendil-works/pi-codemode': 1.2.0
  '@earendil-works/pi-mcp': 1.2.0
  '@earendil-works/pi-telemetry': 1.2.0
  '@earendil-works/pi-tui': 1.2.0
  # Transformers 4.2 permits sharp ^0.34.5; pin its current stable advisory
  # remediation rather than retaining the vulnerable 0.34.5 resolution.
  '@huggingface/transformers>sharp': 0.35.3
  # ORT 1.30.0 permits adm-zip ^0.6.0, but 0.6.0 now carries open advisories;
  # pin the first patched release without changing the ORT ABI.
  'onnxruntime-node>adm-zip': 0.6.1
  # dependency-cruiser 17.3.2 pins these two to vulnerable exact versions.
  'dependency-cruiser>ajv': 8.18.0
  'dependency-cruiser>picomatch': 4.0.5
  # tsx 4.21.0 pins esbuild to ~0.27.0, which is vulnerable; align it with the
  # copy the rest of the graph already resolves.
  'tsx>esbuild': 0.28.2
  # ajv ^3.0.1 and knip ^1.8.0 both admit the vulnerable resolutions, so these
  # transitive-only packages cannot be raised by `pnpm update`.
  'ajv>fast-uri': 3.1.8
  'knip>smol-toml': 1.9.1
  # typescript-eslint's own packages depend on each other with carets
  # (`^8.71.0`), so a fresh resolution always pulls the newest sibling - which
  # the minimumReleaseAge policy then refuses while that release is hours old.
  # Pin the family to one release, the way the Pi runtime set above is pinned.
  '@typescript-eslint/eslint-plugin': 8.71.0
  '@typescript-eslint/parser': 8.71.0
  '@typescript-eslint/project-service': 8.71.0
  '@typescript-eslint/scope-manager': 8.71.0
  '@typescript-eslint/tsconfig-utils': 8.71.0
  '@typescript-eslint/type-utils': 8.71.0
  '@typescript-eslint/types': 8.71.0
  '@typescript-eslint/typescript-estree': 8.71.0
  '@typescript-eslint/utils': 8.71.0
  '@typescript-eslint/visitor-keys': 8.71.0
  'typescript-eslint': 8.71.0
