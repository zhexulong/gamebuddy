packages:
  - host
  - voice-gateway
  - dialogue-web
  # Project-maintained Magic Context fork. Kept out of the main workspace so
  # its Bun build/runtime remains isolated from the GameBuddy Node workspace.
  - '!vendor/magic-context/**'

# Phase 0B intentionally disables optional native/model build scripts. Magic
# Context runs with embeddings off; no optional binary is approved implicitly.
allowBuilds:
  '@google/genai': false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  tree-sitter: true
  tree-sitter-c-sharp: true

overrides:
  # Transformers 4.2 permits sharp ^0.34.5; pin its current stable advisory
  # remediation rather than retaining the vulnerable 0.34.5 resolution.
  '@huggingface/transformers>sharp': 0.35.3
  # ORT 1.24.3 remains required by Transformers 4.2. Its adm-zip range admits
  # 0.6.0, which resolves GHSA-xcpc-8h2w-3j85 without changing the ORT ABI.
  'onnxruntime-node>adm-zip': 0.6.0
